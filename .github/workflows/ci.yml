# sh-video-editor CI. 층 구조·전제·로컬 대응 명령은 docs/guides/testing.md.
#  - PR·main 푸시: lint-unit, engine(clippy·빌드·엔진 기능 테스트·워크플로 회귀), typecheck, web(e2e 데스크톱 뷰포트), web-mobile(allow-failure),
#    desktop(xvfb e2e). web·desktop·typecheck 는 engine 의 산출물(artifact engine-build)을 받아 쓴다.
#  - nightly(schedule)·수동: vendor-ci(이식 엔진 cargo xtask ci, 느림).
#  - 수동(workflow_dispatch 입력 windows_installer): cargo-xwin 으로 Windows .node 를 크로스 빌드해 NSIS 인스톨러를 artifact 로.
# 메모리: 7GB 러너 기준으로 CARGO_BUILD_JOBS=3(docs/guides/packaging.md 실측과 같은 값). 러너가 커지면 올린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 매일 18:00 UTC = 03:00 KST. vendor-ci 만 돈다
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      windows_installer:
        description: 'Windows 인스톨러(cargo-xwin + NSIS)를 만들어 artifact 로 올린다'
        type: boolean
        default: false
      vendor_ci:
        description: '이식 엔진 cargo xtask ci 도 돌린다'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 3
  RUST_BACKTRACE: 1
  NODE_VERSION: 24

jobs:
  lint-unit:
    name: lint + 단위 테스트(커버리지)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: prettier
        run: npx prettier --check .
      - name: 단위 테스트 + 커버리지 임계(packages/editor/vitest.config.ts thresholds)
        run: npm run test:unit:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-editor
          path: |
            packages/editor/coverage/coverage-summary.json
            packages/editor/coverage/lcov.info
          retention-days: 14

  engine:
    name: 엔진 clippy + 빌드(napi Linux, wasm) + 기능 테스트
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # 바인딩 워크스페이스와 이식 엔진 워크스페이스(filmcraft-cli 의 target) 둘 다
          workspaces: |
            packages/engine -> target
            packages/engine/vendor/filmcraft -> target
          # vendor 크레이트는 워크스페이스 밖 path 의존이라 캐시 정리 대상이다. 키에 vendor Cargo.lock 을 넣어 상류 갱신 때 새로 만든다
          key: ${{ hashFiles('packages/engine/vendor/filmcraft/Cargo.lock') }}
      - name: wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh; fi
          wasm-pack --version
      - name: ffmpeg (엔진 기능 테스트의 오라클·코퍼스 생성)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - run: npm ci
      - name: clippy (바인딩 워크스페이스, -D warnings)
        run: cargo clippy --manifest-path packages/engine/Cargo.toml --workspace --all-targets -- -D warnings
      - name: napi .node (Linux)
        run: npm run build:engine:node
      - name: wasm pkg
        run: npm run build:engine:wasm
      - name: cargo test (바인딩 워크스페이스)
        run: npm run test:rust
      - name: 엔진 기능 테스트 (STT 모델이 없으면 그 테스트는 건너뛴다)
        run: npm run test:engine
      - name: filmcraft-cli (워크플로 회귀 테스트와 MCP 가 쓰는 헤드리스 CLI)
        run: cargo build -p filmcraft-cli --release --manifest-path packages/engine/vendor/filmcraft/Cargo.toml
      - name: 워크플로 회귀 (가져오기 -> 자르기 -> 전환 -> 자막 -> 음악 -> 내보내기, ffprobe 검사)
        run: npm run test:workflow -- --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: engine-build
          path: |
            packages/engine/bindings/napi/index.js
            packages/engine/bindings/napi/index.d.ts
            packages/engine/bindings/napi/*.node
            packages/engine/bindings/wasm/pkg
          retention-days: 3
          if-no-files-found: error

  typecheck:
    name: typecheck
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: engine-build
          path: packages/engine/bindings
      - run: npm run typecheck

  web:
    name: 웹 빌드 + e2e (desktop-1440)
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: engine-build
          path: packages/engine/bindings
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
      - name: e2e (포트는 playwright.config.ts 가 빈 포트를 고른다)
        run: npx playwright test -c apps/web/playwright.config.ts --project desktop-1440
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: apps/web/e2e/.results
          retention-days: 7

  web-mobile:
    name: 웹 e2e (mobile-390, 실패 허용)
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 좁은 뷰포트는 드래그·스크롤 경로가 흔들리기 쉬워 결과를 보고만 하고 PR 을 막지 않는다. 안정되면 web 에 합친다
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: engine-build
          path: packages/engine/bindings
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c apps/web/playwright.config.ts --project mobile-390
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-mobile-e2e-results
          path: apps/web/e2e/.results
          retention-days: 7

  desktop:
    name: 데스크톱 빌드 + 스모크 + xvfb e2e
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: engine-build
          path: packages/engine/bindings
      - name: xvfb + Electron 런타임 라이브러리 (Chromium 과 같은 묶음)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          npx playwright install-deps chromium
      - run: npm run build -w apps/desktop
      - name: 스모크 (utility process 엔진 응답 + 크래시 재시작)
        run: npm run smoke -w apps/desktop
      - name: e2e (app 프로젝트 뒤 recovery 프로젝트, playwright.config.ts)
        run: xvfb-run -a npx playwright test -c apps/desktop/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-results
          path: apps/desktop/e2e/.results
          retention-days: 7

  vendor-ci:
    name: 이식 엔진 cargo xtask ci (nightly)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.vendor_ci)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: packages/engine/vendor/filmcraft
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine/vendor/filmcraft -> target
      - name: ffmpeg (오라클 테스트)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: cargo xtask ci (fmt, clippy, test --release, layers, assets, wasm L0~L4)
        run: cargo xtask ci

  windows-installer:
    name: Windows 인스톨러 (cargo-xwin, 수동)
    if: github.event_name == 'workflow_dispatch' && inputs.windows_installer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLVM_VERSION: 23.1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine -> target
          key: win-${{ hashFiles('packages/engine/vendor/filmcraft/Cargo.lock') }}
      - name: LLVM (clang-cl, lld-link, llvm-lib) - docs/guides/packaging.md 경로 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/llvm"
          gh release download "llvmorg-${LLVM_VERSION}" --repo llvm/llvm-project --pattern "LLVM-${LLVM_VERSION}-Linux-X64.tar.xz" --output - \
            | tar -xJ -C "$HOME/.local/llvm" --strip-components=1
          echo "$HOME/.local/llvm/bin" >> "$GITHUB_PATH"
          "$HOME/.local/llvm/bin/clang-cl" --version | head -1
      - name: cargo-xwin
        run: command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked
      - name: Windows SDK/CRT 캐시 (cargo-xwin)
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-sdk-${{ runner.os }}
      - name: NSIS 패키징 도구 (electron-builder 가 Linux 에서 Windows 타깃을 만들 때 wine 을 쓴다)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 wine32:i386
      - run: npm ci
      - name: Windows .node (x86_64-pc-windows-msvc)
        run: npm run build:win:xwin -w @sh-video-editor/engine-node
      - name: NSIS 인스톨러
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/SH-Video-Editor-Setup-*.exe
          retention-days: 30
          if-no-files-found: error
