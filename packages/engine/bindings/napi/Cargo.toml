[package]
name = "sh-video-engine-node"
description = "sh-video-editor 엔진의 Node-API 바인딩 (Electron 메인/유틸리티 프로세스에서 로드)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

# napi-derive 가 FFI 글루에 #[allow(unsafe_code)] 를 생성하므로 워크스페이스의 forbid 를 못 쓴다. deny 로 두고
# 우리 코드에는 unsafe 를 쓰지 않는다 (packages/engine/AGENTS.md 2번의 두 번째 예외).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"

[features]
default = ["stt"]
# 자동 자막(음성 인식, M2-2): Whisper 추론(candle, CPU)과 모델 다운로드(rustls). 데스크톱 전용이라 napi 에만 켠다.
# 모델 가중치는 번들하지 않고 첫 사용 때 동의 후 내려받는다(docs/guides/packaging.md "STT 모델").
stt = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download", "dep:filmcraft-speech"]

[lib]
crate-type = ["cdylib"]

[dependencies]
filmcraft-engine = { workspace = true, features = ["interchange"] }
filmcraft-project = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-speech = { workspace = true, optional = true }
serde_json = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"

# OS 하드웨어 비디오 디코더(Windows: Media Foundation + D3D11/DXVA, macOS: VideoToolbox). 엔진 코덱 앞에 등록만 하고
# 하드웨어가 못 받는 스트림은 자체 디코더로 간다. Linux 에는 경로가 없어 의존하지 않는다(Linux .node 는 그대로).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
filmcraft-platform = { workspace = true }

[build-dependencies]
napi-build = "2"
