[package]
name = "sh-video-engine-wasm"
description = "sh-video-editor 엔진의 WebAssembly 바인딩 (wasm-bindgen). apps/web 이 import 한다"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# 자동 자막(Whisper 추론)을 wasm 에서도 켜 보는 실험용. 기본 off. 결과는 docs/guides/packaging.md "STT 모델" 절.
stt = ["filmcraft-engine/whisper"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-render = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.129"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
